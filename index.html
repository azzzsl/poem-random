<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机古诗</title>
    <style>
        /* 重置默认边距，让内容在 Embed 里不溢出 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent; /* 透明背景，融入 Notion 主题 */
        }
        #poem-card {
            text-align: center;
            padding: 20px 16px;
            max-width: 700px;
            font-family: "汇文明朝体GBK", "Noto Serif SC", "宋体", serif;
        }
        #poem-content {
            font-size: 1.4em;
            line-height: 1.6;
            color: #333;
            margin: 0 0 12px 0;
            font-weight: 500;
        }
        #poem-origin {
            font-size: 0.9em;
            color: #777;
            margin: 0;
        }
        #error-msg {
            color: #c44;
            font-size: 0.8em;
            margin: 8px 0 0;
        }
    </style>
</head>
<body>
    <div id="poem-card">
        <div id="poem-content">⏳ 加载中...</div>
        <div id="poem-origin"></div>
        <div id="error-msg"></div>
    </div>

    <script>
        // 获取 DOM 元素
        const poemContent = document.getElementById('poem-content');
        const poemOrigin = document.getElementById('poem-origin');
        const errorMsg = document.getElementById('error-msg');

        function loadPoem() {
            poemContent.textContent = '⏳ 加载中...';
            poemOrigin.textContent = '';
            errorMsg.textContent = '';

            fetch('https://v1.jinrishici.com/all.json')
                .then(function(response) {
                    if (!response.ok) throw new Error('网络错误');
                    return response.json();
                })
                .then(function(data) {
                    const content = data.content || '（无内容）';
                    const author = data.author || '佚名';
                    const origin = data.origin || '未知';
                    
                    poemContent.textContent = content;
                    poemOrigin.textContent = '—— ' + author + '《' + origin + '》';
                })
                .catch(function(err) {
                    console.error('诗句加载失败', err);
                    errorMsg.textContent = '加载失败，请刷新重试';
                    poemContent.textContent = '';
                });
        }

        // 页面加载即执行
        loadPoem();
    </script>
</body>
</html>
